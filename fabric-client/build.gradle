plugins { id 'net.fabricmc.fabric-loom' version '1.17.+' }
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories { maven { url = "https://maven.fabricmc.net/" } }
dependencies {
 minecraft "com.mojang:minecraft:26.2"
 mappings loom.officialMojangMappings()
 modImplementation "net.fabricmc:fabric-loader:0.19.3"
 modImplementation "net.fabricmc.fabric-api:fabric-api:0.161.0+26.2"
}
loom { }
java { toolchain { languageVersion = JavaLanguageVersion.of(25) }; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 25 }
processResources { inputs.property "version", project.version; filesMatching("fabric.mod.json") { expand "version": project.version } }
